# When moving to a custom domain, change site_url only -- nothing else.
site_url: https://Biomedical-Imaging-Group.github.io/OrientationJ/
repo_url: https://github.com/Biomedical-Imaging-Group/OrientationJ
repo_name: Biomedical-Imaging-Group/OrientationJ

site_name: OrientationJ
site_description: >-
  Orientation, energy and coherency analysis of images using the gradient
  structure tensor. ImageJ and Fiji plugins from the Biomedical Imaging Group, EPFL.
site_author: Daniel Sage
copyright: Biomedical Imaging Group, EPFL — GPL-3.0

edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit      # "Edit this page" pencil, straight to GitHub
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # LaTeX maths for the theory pages
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - User guide:
      - Installation: installation.md
      - Plugin modes: modes.md
  - Theory: theory.md
  - Test images: test-images.md
  - Benchmarking: benchmarking.md
  - References: references.md
  - History: HISTORY.md
