# When moving to a custom domain, change site_url only -- nothing else.
site_url: https://Biomedical-Imaging-Group.github.io/OrientationJ/

site_name: OrientationJ
repo_url: https://github.com/Biomedical-Imaging-Group/OrientationJ
repo_name: GitHub
site_description: >-
  Orientation, energy and coherency analysis of images using the gradient
  structure tensor. ImageJ and Fiji plugins from the Biomedical Imaging Group, EPFL.
site_author: Daniel Sage
copyright: >-
  <span class="oj-foot-left"><img class="oj-foot-mark" src="oj:assets/center-for-imaging.svg"
  alt="EPFL Center for Imaging"><span class="oj-foot-who"><span class="oj-foot-label">Contact</span><a
  href="mailto:daniel.sage@epfl.ch">daniel.sage@epfl.ch</a><br><a
  href="https://imaging.epfl.ch/">imaging.epfl.ch</a></span></span>
  <span class="oj-foot-right"><span class="oj-foot-label">Open-source software</span><span
  class="oj-foot-title">OrientationJ 2.1.0</span><br>August 2026 · <a
  href="https://github.com/Biomedical-Imaging-Group/OrientationJ">GitHub</a> · <a
  href="https://github.com/Biomedical-Imaging-Group/OrientationJ/blob/master/LICENSE">GPL-3.0</a></span>

theme:
  name: material
  language: en
  logo: assets/center-for-imaging.svg   # complete logo: the mark and the wordmark
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github    # the GitHub mark, not the generic git one
  font: false                   # no Google Fonts: Helvetica set in extra.css
  features:
    - navigation.indexes        # a section label opens its own page
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    # no toc.integrate: page headings would add a third level to the left menu
    # (the right-hand table of contents is hidden in stylesheets/extra.css)
  palette:
    - scheme: default
      primary: white            # clean light header, book-like
      accent: indigo            # fine-tuned in stylesheets/extra.css
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false              # no "Made with Material for MkDocs" in the footer

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # LaTeX maths for the theory pages
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/nav.js
  - javascripts/compare.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - OrientationJ: index.md
  - Installation: installation/index.md
  - How to use:
      - user-guide/index.md
      - All plugins: user-guide/plugins.md
      - Color Survey HSB: user-guide/color-survey.md
      - Macros: user-guide/macros.md
      - Analysis Scale σ: user-guide/select-scale.md
      - Selecting the gradient: user-guide/select-gradient.md
  - How to cite: how-to-cite.md
  - Theory:
      - theory/index.md
      # sections of the page above: see docs/javascripts/nav.js
      - Gradient Structure Tensor: "oj:theory/#gradient-structure-tensor"
      - Features and invariants: "oj:theory/#features-and-invariants"
  - Test images: test-images.md
  - Assessments:
      - assessment/index.md
      - Benchmarking: assessment/benchmarking.md
      - Compare gradients: assessment/compare-gradients.md
      - Python port: assessment/python-port.md
      - Operator: assessment/operator.md
  - Use cases:
      - use-cases/index.md
      - In the literature: "oj:use-cases/#orientationj-in-the-literature"
      - External resources: "oj:use-cases/#external-resources"
      - Comparisons and tools: "oj:use-cases/#comparisons-validation-and-other-tools"
  - Javadoc API: https://Biomedical-Imaging-Group.github.io/OrientationJ/api/
