# When moving to a custom domain, change site_url only -- nothing else.
site_url: https://Biomedical-Imaging-Group.github.io/OrientationJ/

site_name: OrientationJ
site_description: >-
  Orientation, energy and coherency analysis of images using the gradient
  structure tensor. ImageJ and Fiji plugins from the Biomedical Imaging Group, EPFL.
site_author: Daniel Sage
copyright: Daniel Sage — Biomedical Imaging Group, EPFL

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false                   # no Google Fonts: Helvetica set in extra.css
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.integrate             # page headings fold into the left menu
    - toc.follow
  palette:
    - scheme: default
      primary: white            # clean light header, book-like
      accent: indigo            # fine-tuned in stylesheets/extra.css
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false              # no "Made with Material for MkDocs" in the footer

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # LaTeX maths for the theory pages
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - User guide:
      - Installation: installation.md
      - How to use: how-to-use.md
  - Theory: theory.md
  - Test images: test-images.md
  - Benchmarking: benchmarking.md
  - In the literature: https://Biomedical-Imaging-Group.github.io/OrientationJ/literature.html
  - Javadoc API: https://Biomedical-Imaging-Group.github.io/OrientationJ/api/
