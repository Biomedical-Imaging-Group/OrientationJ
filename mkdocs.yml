# When moving to a custom domain, change site_url only -- nothing else.
site_url: https://Biomedical-Imaging-Group.github.io/OrientationJ/

site_name: OrientationJ
repo_url: https://github.com/Biomedical-Imaging-Group/OrientationJ
repo_name: GitHub
site_description: >-
  Orientation, energy and coherency analysis of images using the gradient
  structure tensor. ImageJ and Fiji plugins from the Biomedical Imaging Group, EPFL.
site_author: Daniel Sage
copyright: >-
  <strong>Orientation<span class="oj-banner__j">J</span></strong> —
  Directional analysis of 2D images — ImageJ/Fiji plugins
  <span class="oj-foot-credit"><a href="mailto:daniel.sage@epfl.ch">Daniel Sage</a> ·
  <a href="https://imaging.epfl.ch/">Center for Imaging</a> and
  <a href="https://bigwww.epfl.ch/">Biomedical Imaging Group</a>,
  <a href="https://www.epfl.ch/">EPFL</a></span>
  <span class="oj-foot-version">Version 2.1.0 · August 2026</span>

theme:
  name: material
  language: en
  logo: assets/logo-orientationj.png   # complete logo: the mark and the wordmark
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github    # the GitHub mark, not the generic git one
  font: false                   # no Google Fonts: Helvetica set in extra.css
  features:
    - navigation.indexes        # a section label opens its own page
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    # no toc.integrate: page headings would add a third level to the left menu
    # (the right-hand table of contents is hidden in stylesheets/extra.css)
  palette:
    - scheme: default
      primary: white            # clean light header, book-like
      accent: indigo            # fine-tuned in stylesheets/extra.css
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false              # no "Made with Material for MkDocs" in the footer

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # LaTeX maths for the theory pages
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/nav.js
  - javascripts/compare.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation:
      - installation/index.md
      - Version history: installation/history.md
  - User guide:
      - user-guide/index.md
      - All plugins: user-guide/plugins.md
      - Selecting the scale σ: user-guide/select-scale.md
      - Selecting the gradient: user-guide/select-gradient.md
  - Theory:
      - theory/index.md
      # sections of the page above: see docs/javascripts/nav.js
      - The structure tensor: "oj:theory/#the-structure-tensor"
      - Features and invariants: "oj:theory/#features-and-invariants"
  - Test images: test-images.md
  - Assessment:
      - assessment/index.md
      - Benchmarking: assessment/benchmarking.md
      - Compare gradients: assessment/compare-gradients.md
      - Python port: assessment/python-port.md
      - Operator: assessment/operator.md
  - Use cases:
      - use-cases/index.md
      - In the literature: "oj:use-cases/literature.html"
      - Primary references: "oj:use-cases/#primary-references"
      - Software and resources: "oj:use-cases/#software-and-resources"
      - Community discussions: "oj:use-cases/#community-discussions"
      - Validation and related tools: "oj:use-cases/#validation-and-related-tools"
  - Javadoc API: https://Biomedical-Imaging-Group.github.io/OrientationJ/api/
